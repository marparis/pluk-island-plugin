name: pluk_notify
manifest_version: 1
version: 0.5.3
description: "Push notifications for the PLUK Island Android app: approvals, questions, replies and failures, sealed end to end and sent through your own Firebase project."
author: PLUK Island
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_hooks:
  - pre_tool_call
  - post_llm_call
  - on_session_end
  - pre_approval_request
  - post_approval_response
  - on_human_input_request
  - on_human_input_resolved
  - subagent_start
provides_tools:
  - pluk_call_user
